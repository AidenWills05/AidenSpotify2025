<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main indie aura gradient (significantly more opaque) -->
    <linearGradient id="indie-g1" x1="420" y1="300" x2="1180" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4A94F" stop-opacity="0.48"/>   <!-- warm mustard -->
      <stop offset="0.28" stop-color="#D88A9A" stop-opacity="0.72"/> <!-- dusty pink -->
      <stop offset="0.65" stop-color="#5FA3A3" stop-opacity="0.70"/> <!-- muted teal -->
      <stop offset="1" stop-color="#3A3A2E" stop-opacity="0.22"/>    <!-- earthy fade -->
    </linearGradient>

    <!-- Secondary glow (stronger, more visible) -->
    <radialGradient id="indie-g2" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1040 380) rotate(135) scale(420 260)">
      <stop offset="0" stop-color="#E7B56C" stop-opacity="0.65"/>  <!-- strong mustard glow -->
      <stop offset="1" stop-color="#E7B56C" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft blur filter -->
    <filter id="indie-blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <g filter="url(#indie-blur)">
    <!-- Main cloud mass -->
    <path
      d="M380 460C395 350 500 290 610 260C740 225 875 240 1000 250C1100 258 1210 290 1245 370C1280 450 1220 550 1130 615C1045 675 925 695 805 690C680 685 545 675 465 615C390 560 365 565 380 460Z"
      fill="url(#indie-g1)"
    />

    <!-- Secondary glow -->
    <path
      d="M860 360C890 300 975 270 1045 280C1115 290 1180 345 1178 405C1175 465 1100 500 1035 520C975 538 900 540 855 505C810 470 830 425 860 360Z"
      fill="url(#indie-g2)"
    />
  </g>
</svg>

